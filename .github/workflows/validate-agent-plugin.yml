name: Validate agent plugin

on:
  push:
    paths:
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - "plugins/centaur/**"
      - "scripts/validate_agent_plugin.py"
      - "scripts/test_validate_agent_plugin.py"
      - ".github/workflows/validate-agent-plugin.yml"
  pull_request:
    paths:
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - "plugins/centaur/**"
      - "scripts/validate_agent_plugin.py"
      - "scripts/test_validate_agent_plugin.py"
      - ".github/workflows/validate-agent-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python scripts/test_validate_agent_plugin.py
      - run: python scripts/validate_agent_plugin.py
