[project]
name = "linear"
description = "Linear issue tracking — issues, projects, milestones, cycles, teams"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
linear = "centaur_tool_linear.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_linear"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
# The proxy injects the current access token of the `linear` Console broker
# credential: a Linear OAuth app's client_credentials grant, which Console
# re-mints before the token expires. Create it with `centaur-perms broker
# create --foreign-id linear --token-endpoint https://api.linear.app/oauth/token`
# and the app's client id, secret, and scopes. Every client-credentials
# consumer of the app (linearbot included) must request the same scopes:
# Linear revokes all of the app's tokens when one is minted with different
# scopes. `LINEAR_API_KEY` stays the placeholder name the client sends.
secrets = [
    {type = "brokered_token", name = "LINEAR_API_KEY", credential = "linear", hosts = ["api.linear.app", "uploads.linear.app"]},
]
